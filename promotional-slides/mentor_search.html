<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>효율적인 멘토 검색 및 필터링</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: #FFFFFF;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            padding-top: 60px;
        }
        
        .content-section {
            padding-left: 60px;
        }
        
        .slide-title {
            font-size: 44px;
            font-weight: 800;
            color: #1A1A1A;
            margin-bottom: 30px;
            line-height: 1.2;
        }
        
        .accent-line {
            width: 60px;
            height: 4px;
            background: #4361EE;
            margin-bottom: 20px;
        }
        
        .description-text {
            font-size: 18px;
            color: #4A4A4A;
            line-height: 1.8;
            margin-bottom: 25px;
            font-weight: 500;
        }
        
        .highlight-text {
            color: #FF3366;
            font-weight: 700;
        }
        
        .feature-section {
            margin-top: 30px;
        }
        
        .feature-title {
            font-size: 16px;
            font-weight: 700;
            color: #1A1A1A;
            margin-bottom: 12px;
            margin-top: 20px;
        }
        
        .feature-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .feature-item {
            font-size: 15px;
            color: #4A4A4A;
            line-height: 1.6;
            padding-left: 25px;
            position: relative;
        }
        
        .feature-item::before {
            content: "•";
            position: absolute;
            left: 0;
            color: #4361EE;
            font-weight: 700;
            font-size: 20px;
        }
        
        .image-section {
            display: flex;
            align-items: center;
            justify-content: center;
            padding-right: 60px;
        }
        
        .search-image {
            width: 100%;
            max-width: 520px;
            height: 400px;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="content-section">
            <div class="accent-line"></div>
            <h2 class="slide-title">효율적인 멘토 검색 및 필터링</h2>
            
            <p class="description-text">
                학생들은 <span class="highlight-text">전공, 지역, 학년</span>을 기준으로 멘토를 검색할 수 있습니다.
            </p>
            
            <p class="description-text">
                검색 결과는 다양한 옵션으로 정렬되어 자신의 필요에 맞는 최적의 멘토를 빠르게 찾을 수 있습니다.
            </p>
            
            <div class="feature-section">
                <div class="feature-title">필터링 옵션</div>
                <div class="feature-list">
                    <div class="feature-item">대학별 필터링</div>
                    <div class="feature-item">전공 분야별 필터링</div>
                    <div class="feature-item">학년별 필터링</div>
                    <div class="feature-item">활동 지역별 필터링</div>
                </div>
            </div>
            
            <div class="feature-section">
                <div class="feature-title">정렬 옵션</div>
                <div class="feature-list">
                    <div class="feature-item">평점 높은순</div>
                    <div class="feature-item">최신 가입순</div>
                    <div class="feature-item">리뷰 많은순</div>
                    <div class="feature-item">상담 경험 많은순</div>
                </div>
            </div>
        </div>
        
        <div class="image-section">
            <img src="https://d2xsxph8kpxj0f.cloudfront.net/310519663280786037/Gy6RaYwMhnXP5TJQbTpkxJ/univmatch-hero-aDC47v9Z3whAMAW5i8u3L9.webp" alt="멘토 검색 및 필터링 인터페이스" class="search-image">
        </div>
    </div>
</body>
</html>
