<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>현재 상태</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: #FFFFFF;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            padding-top: 60px;
        }
        
        .header-section {
            text-align: center;
            margin-bottom: 50px;
        }
        
        .accent-line {
            width: 60px;
            height: 4px;
            background: #4361EE;
            margin: 0 auto 20px;
        }
        
        .slide-title {
            font-size: 48px;
            font-weight: 800;
            color: #1A1A1A;
            line-height: 1.2;
        }
        
        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 40px;
            width: 100%;
            max-width: 1100px;
            padding: 0 60px;
        }
        
        .status-column {
            display: flex;
            flex-direction: column;
        }
        
        .status-header {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .status-icon {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            color: white;
            margin-right: 15px;
        }
        
        .status-icon-completed {
            background: #4361EE;
        }
        
        .status-icon-progress {
            background: #FF3366;
        }
        
        .status-icon-planned {
            background: #00D4AA;
        }
        
        .status-title {
            font-size: 22px;
            font-weight: 700;
            color: #1A1A1A;
        }
        
        .status-items {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .status-item {
            font-size: 15px;
            color: #4A4A4A;
            line-height: 1.6;
            padding-left: 25px;
            position: relative;
            font-weight: 500;
        }
        
        .status-item::before {
            position: absolute;
            left: 0;
            font-weight: 700;
            font-size: 16px;
        }
        
        .completed-item::before {
            content: "✓";
            color: #4361EE;
        }
        
        .progress-item::before {
            content: "◐";
            color: #FF3366;
        }
        
        .planned-item::before {
            content: "◯";
            color: #00D4AA;
        }
        
        .summary-section {
            width: 100%;
            background: #F0F8FF;
            margin-top: 50px;
            padding-top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .summary-title {
            font-size: 24px;
            font-weight: 700;
            color: #1A1A1A;
            margin-bottom: 25px;
        }
        
        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 30px;
            max-width: 1000px;
            padding: 0 60px;
        }
        
        .summary-item {
            text-align: center;
        }
        
        .summary-number {
            font-size: 36px;
            font-weight: 800;
            color: #4361EE;
            margin-bottom: 8px;
        }
        
        .summary-label {
            font-size: 14px;
            color: #4A4A4A;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header-section">
            <div class="accent-line"></div>
            <h2 class="slide-title">프로덕션급 수준의 완성도 달성</h2>
        </div>
        
        <div class="status-grid">
            <div class="status-column">
                <div class="status-header">
                    <div class="status-icon status-icon-completed">✓</div>
                    <h3 class="status-title">완료된 항목</h3>
                </div>
                <div class="status-items">
                    <div class="status-item completed-item">모든 핵심 기능 구현</div>
                    <div class="status-item completed-item">71개 테스트 전체 통과</div>
                    <div class="status-item completed-item">TypeScript 컴파일 에러 0건</div>
                    <div class="status-item completed-item">프로덕션급 리팩토링 완료</div>
                    <div class="status-item completed-item">성능 최적화 완료</div>
                </div>
            </div>
            
            <div class="status-column">
                <div class="status-header">
                    <div class="status-icon status-icon-progress">◐</div>
                    <h3 class="status-title">진행 중인 항목</h3>
                </div>
                <div class="status-items">
                    <div class="status-item progress-item">서버 코드 도메인별 분리</div>
                    <div class="status-item progress-item">E2E 테스트 작성</div>
                    <div class="status-item progress-item">SEO 최적화</div>
                    <div class="status-item progress-item">접근성 개선</div>
                </div>
            </div>
            
            <div class="status-column">
                <div class="status-header">
                    <div class="status-icon status-icon-planned">◯</div>
                    <h3 class="status-title">계획된 항목</h3>
                </div>
                <div class="status-items">
                    <div class="status-item planned-item">AI 기반 멘토 추천</div>
                    <div class="status-item planned-item">완전한 결제 통합</div>
                    <div class="status-item planned-item">모바일 앱 출시</div>
                    <div class="status-item planned-item">국제 확장</div>
                    <div class="status-item planned-item">커뮤니티 기능</div>
                </div>
            </div>
        </div>
        
        <div class="summary-section">
            <h3 class="summary-title">핵심 성과 지표</h3>
            <div class="summary-grid">
                <div class="summary-item">
                    <div class="summary-number">71</div>
                    <div class="summary-label">자동화 테스트</div>
                </div>
                <div class="summary-item">
                    <div class="summary-number">0</div>
                    <div class="summary-label">컴파일 에러</div>
                </div>
                <div class="summary-item">
                    <div class="summary-number">30-40%</div>
                    <div class="summary-label">성능 개선</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
